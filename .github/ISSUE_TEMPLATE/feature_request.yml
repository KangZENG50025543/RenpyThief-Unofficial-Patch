name: 功能建议
description: 建议面向公开项目的新功能或体验改进
title: "[Feature] "
body:
  - type: markdown
    attributes:
      value: |
        请先搜索现有 Issue。项目不会接受绕过登录、注册、额度、付费授权或重新分发原版程序的功能请求。

  - type: textarea
    id: problem
    attributes:
      label: 需要解决的问题
      description: 请描述使用场景和目前受到的影响，不要只写实现名称。
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      description: 描述预期行为、界面或配置方式。
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案

  - type: textarea
    id: compatibility
    attributes:
      label: 兼容性与风险
      description: 如涉及 Provider、网络、原生组件或 RenpyThief 版本，请说明。

  - type: checkboxes
    id: confirmations
    attributes:
      label: 提交确认
      options:
        - label: 我已搜索现有 Issue，未找到相同建议。
          required: true
        - label: 该建议不要求绕过登录、注册、额度、付费授权或分发第三方专有文件。
          required: true
        - label: 我没有提交 API Key、Cookie、账号信息、游戏正文或其他隐私。
          required: true
